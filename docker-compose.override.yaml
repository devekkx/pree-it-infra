# Local development conveniences — never used in CI/prod
services:
  postgres:
    ports:
      - "5432:5432"

  redis:
    ports:
      - "6379:6379"

  grafana:
    ports:
      - "3001:3000"

  gateway:
    volumes:
      - ../preeit-gateway:/app

  auth:
    volumes:
      - ../preeit-auth:/app
