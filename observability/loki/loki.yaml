auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  log_level: warn

common:
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13 # latest schema - best query performance
      index:
        prefix: index_
        period: 24h

storage_config:
  tsdb_shipper:
    active_index_directory: /loki/index
    cache_location: /loki/index_cache
  filesystem:
    directory: /loki/chunks

compactor:
  working_directory: /loki/compactor
  retention_enabled: true

limits_config:
  retention_period: 744h # 31 days
  max_query_lookback: 744h
  max_query_series_limit: 10000
  ingestion_rate_mb: 16
  ingestion_burst_size_mb: 32
  # Correlate with Tempo: allow Loki → Tempo trace links
  max_entries_limit_per_query: 10000

ruler:
  alertmanager_url: http://localhost:9093

# Derived fields: extract TraceID from logs and link to Tempo
# (Grafana datasource config handles the UI part - see below)
