target: all

server:
  http_listen_port: 9009
  grpc_listen_port: 9095
  log_level: warn

common:
  storage:
    backend: filesystem
    filesystem:
      dir: /data/mimir/blocks

blocks_storage:
  backend: filesystem
  filesystem:
    dir: /data/mimir/blocks
  tsdb:
    dir: /data/mimir/tsdb

compactor:
  data_dir: /data/mimir/compactor
  sharding_ring:
    kvstore:
      store: memberlist

distributor:
  ring:
    kvstore:
      store: memberlist

ingester:
  ring:
    kvstore:
      store: memberlist
    replication_factor: 1

store_gateway:
  sharding_ring:
    replication_factor: 1

ruler:
  rule_path: /data/mimir/ruler

ruler_storage:
  backend: local
  local:
    directory: /data/mimir/ruler-storage

limits:
  compactor_blocks_retention_period: 720h
  max_global_series_per_user: 1500000
  ingestion_rate: 150000
  ingestion_burst_size: 300000
  out_of_order_time_window: 10m

memberlist:
  join_members: []
