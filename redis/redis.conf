# Redis production configuration
# Password is injected at runtime by the entrypoint — not stored in this file.

bind 0.0.0.0
protected-mode yes
port 6379

# Persistence — RDB snapshots
save 900 1
save 300 10
save 60 10000
dbfilename dump.rdb
dir /data

# AOF for durability
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# Memory
maxmemory 256mb
maxmemory-policy allkeys-lru

# Timeouts
timeout 300
tcp-keepalive 60

# Slow log
slowlog-log-slower-than 10000
slowlog-max-len 128

# NOTE: rename-command CONFIG "" is intentionally omitted.
# It breaks --requirepass on the command line because Redis
# applies CLI overrides via internal CONFIG SET after loading
# the config file. Disabling CONFIG prevents the password
# from being set, leaving Redis in protected mode with no auth.
#
# To restrict CONFIG in production, use ACLs instead:
#   user default on >password ~* +@all -CONFIG
# ACL-based restriction is configured in Phase 2 when Redis
# is hardened with per-service users.