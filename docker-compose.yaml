# Top-level secrets - Docker reads plaintext files, injects as /run/secrets/*

secrets:
  chat_db_password:
    file: ./secrets/chat_db_password.txt
  postgres_password:
    file: ./secrets/postgres_password.txt
  redis_password:
    file: ./secrets/redis_password.txt
  jwt_secret:
    file: ./secrets/jwt_secret.txt
  nats_password:
    file: ./secrets/nats_password.txt
  garage_rpc_secret:
    file: ./secrets/garage_rpc_secret.txt
  grafana_password:
    file: ./secrets/grafana_password.txt
  user_db_password:
    file: ./secrets/user_db_password.txt

# Named volumes

volumes:
  caddy_data:
  caddy_certs:
  postgres_data:
  redis_data:
  nats_data:
  grafana_data:
  loki_data:
  mimir_data:
  tempo_data:
  garage_data:

# Networks - all internal except the Caddy edge network

networks:
  edge: # Caddy ↔ services
  internal: # service ↔ service (no external access)
  observability: # metrics scraping

# Services

services:
  #  Reverse Proxy
  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_certs:/config
    networks:
      - edge
    depends_on:
      gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:2019/metrics"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  #  PostgreSQL
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  #  Redis
  redis:
    image: redis:7.2-alpine
    restart: unless-stopped
    entrypoint:
      - sh
      - -c
      - |
        PASS=$$(cat /run/secrets/redis_password)
        if [ -z "$$PASS" ]; then
          echo "[FATAL] redis_password secret is empty or unreadable" >&2
          exit 1
        fi
        echo "[INFO] Redis starting with password ($${#PASS} chars)"
        exec redis-server /etc/redis/redis.conf --requirepass "$$PASS"
    secrets:
      - redis_password
    volumes:
      - redis_data:/data
      - ./redis/redis.conf:/etc/redis/redis.conf:ro
    networks:
      - internal
    healthcheck:
      test:
        - CMD-SHELL
        - redis-cli -a "$$(cat /run/secrets/redis_password)" ping | grep -q PONG
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  #  Auth Service
  auth:
    image: preeit-auth:latest
    build:
      context: ../pree-it-auth
      dockerfile: Dockerfile
      target: production
    restart: unless-stopped
    entrypoint:
      - sh
      - -c
      - |
        export JWT_SECRET=$$(cat /run/secrets/jwt_secret)
        export POSTGRES_PASSWORD=$$(cat /run/secrets/postgres_password)
        export REDIS_PASSWORD=$$(cat /run/secrets/redis_password)
        export NATS_PASSWORD=$$(cat /run/secrets/nats_password)
        exec /auth
    environment:
      APP_ENV: production
      SERVICE_NAME: preeit-auth
      LISTEN_ADDR: ":${AUTH_PORT}"
      POSTGRES_HOST: postgres
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}
      REDIS_ADDR: redis:6379
      NATS_URL: nats://nats:4222
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_ENDPOINT}
    secrets:
      - postgres_password
      - redis_password
      - jwt_secret
      - nats_password
    networks:
      - internal
      - observability
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:${AUTH_PORT}/health/live"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

  # API Gateway
  gateway:
    image: preeit-gateway:latest
    build:
      context: ../pree-it-gateway
      dockerfile: Dockerfile
      target: production
    restart: unless-stopped
    entrypoint:
      - sh
      - -c
      - |
        export JWT_SECRET=$$(cat /run/secrets/jwt_secret)
        export REDIS_PASSWORD=$$(cat /run/secrets/redis_password)
        export POSTGRES_PASSWORD=$$(cat /run/secrets/postgres_password)
        exec /gateway
    environment:
      APP_ENV: production
      SERVICE_NAME: preeit-gateway
      LISTEN_ADDR: ":${GATEWAY_PORT}"
      AUTH_SERVICE_URL: http://auth:${AUTH_PORT}
      REDIS_ADDR: redis:6379
      POSTGRES_HOST: postgres
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_ENDPOINT}
    secrets:
      - redis_password
      - postgres_password
      - jwt_secret
    networks:
      - edge
      - internal
      - observability
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      auth:
        condition: service_healthy
    healthcheck:
      test:
        ["CMD-SHELL", "wget -qO- http://localhost:${GATEWAY_PORT}/health/live"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

  # user Service
  user-service:
    build:
      context: ../preeit-user
      dockerfile: Dockerfile
      target: production
    container_name: preeit-user-service
    restart: unless-stopped
    environment:
      - USER_SERVICE_NAME=user-service
      - USER_SERVICE_PORT=8083
      - USER_ENVIRONMENT=production
      - USER_DB_HOST=postgres
      - USER_DB_PORT=5432
      - USER_DB_USER=user_service
      - USER_DB_NAME=preeit
      - USER_DB_SSLMODE=disable
      - USER_NATS_URL=nats://nats:4222
      - USER_OTEL_ENDPOINT=otel-collector:4317
    secrets:
      - user_db_password
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_started
      otel-collector:
        condition: service_started
    networks:
      - preeit-network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8083/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  # OpenTelemetry Collector
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.101.0
    restart: unless-stopped
    command: ["--config=/etc/otel/otel-collector.yaml"]
    volumes:
      - ./observability/otel-collector.yaml:/etc/otel/otel-collector.yaml:ro
    networks:
      - observability
      - internal
    depends_on:
      - loki
      - tempo
      - mimir
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:13133/"]
      interval: 10s
      timeout: 5s
      retries: 3

  # Loki (log aggregation)
  loki:
    image: grafana/loki:3.0.0
    restart: unless-stopped
    command: ["-config.file=/etc/loki/loki.yaml"]
    volumes:
      - ./observability/loki/loki.yaml:/etc/loki/loki.yaml:ro
      - loki_data:/loki
    networks:
      - observability
    healthcheck:
      test:
        ["CMD-SHELL", "wget -qO- http://localhost:3100/ready | grep -q ready"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Tempo (distributed tracing)
  tempo:
    image: grafana/tempo:2.4.1
    restart: unless-stopped
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    volumes:
      - ./observability/tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo_data:/var/tempo
    networks:
      - observability
    healthcheck:
      test:
        ["CMD-SHELL", "wget -qO- http://localhost:3200/ready | grep -q ready"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Mimir (scalable Prometheus-compatible metrics)
  mimir:
    image: grafana/mimir:2.12.0
    restart: unless-stopped
    command:
      - "--config.file=/etc/mimir/mimir.yaml"
      - "--target=all" # monolithic mode for Phase 1
    volumes:
      - ./observability/mimir/mimir.yaml:/etc/mimir/mimir.yaml:ro
      - mimir_data:/data/mimir
    networks:
      - observability
    healthcheck:
      test:
        ["CMD-SHELL", "wget -qO- http://localhost:9009/ready | grep -q ready"]
      interval: 10s
      timeout: 5s
      retries: 5

  #  NATS
  nats:
    image: nats:2.10-alpine
    restart: unless-stopped
    entrypoint:
      - sh
      - -c
      - |
        export NATS_PASSWORD=$$(cat /run/secrets/nats_password)
        exec nats-server -c /etc/nats/nats.conf
    secrets:
      - nats_password
    volumes:
      - ./nats/nats.conf:/etc/nats/nats.conf:ro
      - nats_data:/data
    networks:
      - internal
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8222/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Garage (S3-compatible object storage)
  garage:
    image: dxflrs/garage:v2.3.0
    restart: unless-stopped
    command: /garage server
    secrets:
      - source: garage_rpc_secret
        mode: 0444
    volumes:
      - ./garage/garage.toml:/etc/garage.toml:ro
      - garage_data:/var/lib/garage
    networks:
      - internal
    healthcheck:
      test: ["CMD", "/garage", "status"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  #  Grafana
  grafana:
    image: grafana/grafana:11.0.0
    restart: unless-stopped
    # Grafana's official image runs as uid 472. Docker Compose mounts
    # file-based secrets as root:root 0400 by default, which uid 472
    # cannot read. We read the secret in the entrypoint before exec-ing
    # the real Grafana process so the password is never in the compose
    # file, .env, or container environment at rest.
    entrypoint:
      - sh
      - -c
      - |
        export GF_SECURITY_ADMIN_PASSWORD=$$(cat /run/secrets/grafana_password)
        exec /run.sh
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_FEATURE_TOGGLES_ENABLE: "traceqlEditor traceToMetrics"
      GF_EXPLORE_ENABLED: "true"
    secrets:
      - grafana_password
    volumes:
      - grafana_data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
    networks:
      - observability
      - edge
    depends_on:
      loki:
        condition: service_healthy
      tempo:
        condition: service_healthy
      mimir:
        condition: service_healthy
    healthcheck:
      test:
        ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health | grep -q ok"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s
