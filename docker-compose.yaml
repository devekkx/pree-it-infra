# Top-level secrets - Docker reads plaintext files, injects as /run/secrets/*

secrets:
  postgres_password:
    file: ./secrets/postgres_password.txt
  redis_password:
    file: ./secrets/redis_password.txt
  jwt_secret:
    file: ./secrets/jwt_secret.txt
  nats_password:
    file: ./secrets/nats_password.txt
  minio_root_password:
    file: ./secrets/minio_root_password.txt

# Named volumes

volumes:
  caddy_data:
  caddy_certs:
  postgres_data:
  redis_data:
  nats_data:
  grafana_data:
  loki_data:
  minio_data:
  mimir_data:

# Networks - all internal except the Caddy edge network

networks:
  edge: # Caddy ↔ services
  internal: # service ↔ service (no external access)
  observability: # metrics scraping

# Services

services:
  #  Reverse Proxy
  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_certs:/config
    networks:
      - edge
    depends_on:
      gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:2019/metrics"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # MinIO (object storage - images, files, voice notes)
  minio:
    image: minio/minio:RELEASE.2024-05-01T01-11-10Z
    restart: unless-stopped
    command: >
      sh -c "minio server /data
             --console-address ':9001'
             --address ':9000'"
    environment:
      MINIO_ROOT_USER: preeit_admin
      MINIO_ROOT_PASSWORD_FILE: /run/secrets/minio_root_password
    secrets:
      - minio_root_password
    volumes:
      - minio_data:/data
    networks:
      - internal
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mc ready local 2>/dev/null || wget -qO- http://localhost:9000/minio/health/live",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  #  PostgreSQL
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  #  Redis
  redis:
    image: redis:7.2-alpine
    restart: unless-stopped
    command: >
      sh -c "redis-server /etc/redis/redis.conf
             --requirepass $$(cat /run/secrets/redis_password)"
    secrets:
      - redis_password
    volumes:
      - redis_data:/data
      - ./redis/redis.conf:/etc/redis/redis.conf:ro
    networks:
      - internal
    healthcheck:
      test: >
        sh -c "redis-cli -a $$(cat /run/secrets/redis_password) ping | grep PONG"
      interval: 10s
      timeout: 5s
      retries: 5

  #  NATS
  nats:
    image: nats:2.10-alpine
    restart: unless-stopped
    command: ["-c", "/etc/nats/nats.conf"]
    secrets:
      - nats_password
    volumes:
      - ./nats/nats.conf:/etc/nats/nats.conf:ro
      - nats_data:/data
    networks:
      - internal
    healthcheck:
      test: ["CMD", "nats-server", "--health"]
      interval: 10s
      timeout: 5s
      retries: 3

  #  Gateway Service
  gateway:
    image: preeit-gateway:latest
    build:
      context: ../preeit-gateway # sibling repo checkout
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      APP_ENV: production
      LISTEN_ADDR: ":${GATEWAY_PORT}"
      AUTH_SERVICE_URL: http://auth:${AUTH_PORT}
      REDIS_ADDR: redis:6379
      POSTGRES_DSN: "host=postgres user=${POSTGRES_USER} dbname=${POSTGRES_DB} sslmode=disable"
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_ENDPOINT}
      # Secrets injected via files - read at startup
      REDIS_PASSWORD_FILE: /run/secrets/redis_password
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      JWT_SECRET_FILE: /run/secrets/jwt_secret
    secrets:
      - redis_password
      - postgres_password
      - jwt_secret
    networks:
      - edge
      - internal
      - observability
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:${GATEWAY_PORT}/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  #  Auth Service
  auth:
    image: preeit-auth:latest
    build:
      context: ../preeit-auth
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      APP_ENV: production
      LISTEN_ADDR: ":${AUTH_PORT}"
      POSTGRES_DSN: "host=postgres user=${POSTGRES_USER} dbname=${POSTGRES_DB} sslmode=disable"
      REDIS_ADDR: redis:6379
      NATS_URL: nats://nats:4222
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_ENDPOINT}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      REDIS_PASSWORD_FILE: /run/secrets/redis_password
      JWT_SECRET_FILE: /run/secrets/jwt_secret
      NATS_PASSWORD_FILE: /run/secrets/nats_password
    secrets:
      - postgres_password
      - redis_password
      - jwt_secret
      - nats_password
    networks:
      - internal
      - observability
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy

  # OpenTelemetry Collector
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.101.0
    restart: unless-stopped
    command: ["--config=/etc/otel/otel-collector.yml"]
    volumes:
      - ./observability/otel-collector.yml:/etc/otel/otel-collector.yml:ro
    networks:
      - observability
      - internal
    depends_on:
      - loki
      - tempo
      - mimir
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:13133/"]
      interval: 10s
      timeout: 5s
      retries: 3

  # Loki (log aggregation)
  loki:
    image: grafana/loki:3.0.0
    restart: unless-stopped
    command: ["-config.file=/etc/loki/loki.yml"]
    volumes:
      - ./observability/loki/loki.yml:/etc/loki/loki.yml:ro
      - loki_data:/loki
    networks:
      - observability
    healthcheck:
      test:
        ["CMD-SHELL", "wget -qO- http://localhost:3100/ready | grep -q ready"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Tempo (distributed tracing)
  tempo:
    image: grafana/tempo:2.4.1
    restart: unless-stopped
    command: ["-config.file=/etc/tempo/tempo.yml"]
    volumes:
      - ./observability/tempo/tempo.yml:/etc/tempo/tempo.yml:ro
      - tempo_data:/var/tempo
    networks:
      - observability
    healthcheck:
      test:
        ["CMD-SHELL", "wget -qO- http://localhost:3200/ready | grep -q ready"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Mimir (scalable Prometheus-compatible metrics)
  mimir:
    image: grafana/mimir:2.12.0
    restart: unless-stopped
    command:
      - "--config.file=/etc/mimir/mimir.yml"
      - "--target=all" # monolithic mode for Phase 1
    volumes:
      - ./observability/mimir/mimir.yml:/etc/mimir/mimir.yml:ro
      - mimir_data:/data/mimir
    networks:
      - observability
    healthcheck:
      test:
        ["CMD-SHELL", "wget -qO- http://localhost:9009/ready | grep -q ready"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Grafana
  grafana:
    image: grafana/grafana:11.0.0
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_password
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_FEATURE_TOGGLES_ENABLE: "traceqlEditor traceToMetrics"
      # Correlate logs → traces automatically
      GF_EXPLORE_ENABLED: "true"
    secrets:
      - grafana_password
    volumes:
      - grafana_data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
    networks:
      - observability
      - edge
    depends_on:
      - loki
      - tempo
      - mimir
    healthcheck:
      test:
        ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health | grep -q ok"]
      interval: 10s
      timeout: 5s
      retries: 3
