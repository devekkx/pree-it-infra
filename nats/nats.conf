# NATS server — Phase 1 configuration
# Accounts are introduced in Phase 3 when multiple services need isolation.
# For now a single password covers all internal service connections.

port:      4222
http_port: 8222

# JetStream for durable event delivery
jetstream {
  store_dir: /data
  max_memory_store: 256MB
  max_file_store:   1GB
}

# Single authorization block — password is passed via NATS_PASSWORD env var
# set by the Docker Compose service definition
authorization {
  password: $NATS_PASSWORD
  timeout:  2
}

max_payload:    1MB
max_connections: 10000
write_deadline: "2s"

log_time: true
debug:    false
trace:    false