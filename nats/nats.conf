# NATS server configuration

port: 4222
http_port: 8222   # monitoring (internal only)

# JetStream for persistence
jetstream {
  store_dir: /data
  max_memory_store: 256MB
  max_file_store: 1GB
}

# Authorization
authorization {
  # Password read from Docker secret at runtime via env interpolation
  # Use nats-server --pass flag or accounts below
  timeout: 2
}

# Accounts - isolated namespaces per service
accounts {
  CHAT: {
    users: [
      { user: chat_svc, password: $NATS_CHAT_PASSWORD }
    ]
    exports: [
      { stream: "chat.>" }
    ]
  }
  AUTH: {
    users: [
      { user: auth_svc, password: $NATS_AUTH_PASSWORD }
    ]
    exports: [
      { stream: "user.>" }
    ]
  }
  REALTIME: {
    users: [
      { user: realtime_svc, password: $NATS_RT_PASSWORD }
    ]
    imports: [
      { stream: { account: CHAT, subject: "chat.>" } }
      { stream: { account: AUTH, subject: "user.>" } }
    ]
  }
}

# Limits
max_payload: 1MB
max_connections: 10000
write_deadline: "2s"

# Logging (send to stdout for Docker)
log_time: true
debug: false
trace: false