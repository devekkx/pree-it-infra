# NATS server - Phase 1
port:      4222
http_port: 8222

jetstream {
  store_dir:        /data
  max_memory_store: 256MB
  max_file_store:   1GB
}

authorization {
  password: $NATS_PASSWORD
  timeout:  2
}

max_payload:     1MB
max_connections: 10000
write_deadline:  "2s"

logtime: false
debug:   false
trace:   false